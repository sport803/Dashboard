name: Blogger event auto-poster

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Rewrite all eligible existing event posts even if they already match'
        required: false
        default: false
        type: boolean
      league_filter:
        description: 'Limit this manual run to a league ID such as ucl (blank uses the repository default)'
        required: false
        default: ''
        type: string
      event_date:
        description: 'Optional date to fetch (YYYY-MM-DD); blank uses today in EVENT_TIMEZONE'
        required: false
        default: ''
        type: string
      event_date_only:
        description: 'When a date is supplied, publish only matches on that local date'
        required: false
        default: false
        type: boolean
      repair_player_slashes:
        description: 'Repair existing Blogger iframe URLs containing player.html//?'
        required: false
        default: 'false'
        type: boolean
      repair_oneball_replay_urls:
        description: 'Migrate OneBall iframe URLs to .htm replay URLs on all auto-poster event posts'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: blogger-event-auto-poster
  cancel-in-progress: false

jobs:
  publish-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Dashboard
        uses: actions/checkout@v4

      - name: Check Blogger credentials
        id: credentials
        env:
          BLOG_IDS: ${{ secrets.BLOGGER_BLOG_IDS || secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          if [ -n "$BLOG_IDS" ] && [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ] && [ -n "$BLOGGER_REFRESH_TOKEN" ] && [ -n "$IMGBB_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Blogger secrets are not configured; skipping this run."
          fi

      - name: Set up Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install thumbnail renderer
        if: steps.credentials.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Determine publishing date
        id: run-date
        if: steps.credentials.outputs.ready == 'true'
        env:
          INPUT_DATE: ${{ inputs.event_date }}
          INPUT_DATE_ONLY: ${{ inputs.event_date_only }}
        run: |
          echo "event_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          echo "event_date_only=${INPUT_DATE_ONLY:-false}" >> "$GITHUB_OUTPUT"

      - name: Run Blogger event publisher
        if: steps.credentials.outputs.ready == 'true'
        env:
          BLOGGER_BLOG_IDS: ${{ secrets.BLOGGER_BLOG_IDS || secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          EVENT_TIMEZONE: ${{ vars.EVENT_TIMEZONE }}
          AUTO_POST_LEAGUES: ${{ inputs.league_filter || vars.AUTO_POST_LEAGUES }}
          EVENT_DATE: ${{ steps.run-date.outputs.event_date }}
          EVENT_DATE_ONLY: ${{ steps.run-date.outputs.event_date_only }}
          FORCE_UPDATE: ${{ inputs.force_update }}
          ENRICH_PLAYER_DATA: ${{ vars.ENRICH_PLAYER_DATA }}
          SUPERSPORT_HIGHLIGHTS: ${{ vars.SUPERSPORT_HIGHLIGHTS }}
          LIVETV_HIGHLIGHTS: ${{ vars.LIVETV_HIGHLIGHTS }}
          PLAYER_BASE_URL: https://www.sport803.online/p/player.html
          XOILAC_HOME_URL: https://xoilaczzz.pro/
          REPAIR_PLAYER_SLASHES: ${{ inputs.repair_player_slashes }}
          REPAIR_ONEBALL_REPLAY_URLS: ${{ inputs.repair_oneball_replay_urls }}
        run: node scripts/blogger-auto-poster.mjs
